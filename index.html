<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الذكي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        .chat-header {
            background: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 20px;
            line-height: 1.5;
            font-size: 0.95rem;
        }
        .user-message {
            background: #007bff;
            color: white;
            align-self: flex-start;
            border-bottom-right-radius: 2px;
        }
        .bot-message {
            background: #e9ecef;
            color: #333;
            align-self: flex-end;
            border-bottom-left-radius: 2px;
        }
        .chat-input {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            gap: 10px;
        }
        .chat-input input {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 1rem;
        }
        .chat-input button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .chat-input button:hover {
            background: #0056b3;
        }
        .loading {
            font-style: italic;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        🤖 روبوت الدردشة الذكي (HTML)
    </div>
    <div class="chat-messages" id="chat-messages">
        <div class="message bot-message">مرحباً! أنا مساعدك الذكي. كيف يمكنني مساعدتك اليوم؟</div>
    </div>
    <div class="chat-input">
        <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script>
    // ⚠️ تنبيه: ضع مفتاح API الخاص بك هنا
    const API_KEY = 'AQ.Ab8RN6JO59QPLF0R42MF0MwJnScSxdxKkLX-3SPuGxgPM-fZyg';
    
    // يمكنك تغيير اسم النموذج إذا لزم الأمر
    const MODEL_NAME = 'gemini-1.5-flash'; 

    async function sendMessage() {
        const inputField = document.getElementById('user-input');
        const messageText = inputField.value.trim();
        
        if (!messageText) return;
        
        // 1. عرض رسالة المستخدم
        appendMessage(messageText, 'user-message');
        inputField.value = '';
        
        // 2. عرض مؤشر التحميل
        const loadingId = appendMessage('جاري التفكير...', 'bot-message loading');
        
        // 3. إرسال الطلب إلى Gemini API
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: messageText }]
                    }]
                })
            });
            
            const data = await response.json();
            
            // إزالة رسالة التحميل
            document.getElementById(loadingId).remove();
            
            if (data.error) {
                appendMessage('عذراً، حدث خطأ: ' + data.error.message, 'bot-message');
            } else if (data.candidates && data.candidates.length > 0) {
                const botReply = data.candidates[0].content.parts[0].text;
                appendMessage(botReply, 'bot-message');
            } else {
                appendMessage('لم أتمكن من توليد رد.', 'bot-message');
            }
            
        } catch (error) {
            document.getElementById(loadingId).remove();
            appendMessage('عذراً، حدث خطأ في الاتصال.', 'bot-message');
        }
    }

    function appendMessage(text, className) {
        const messagesContainer = document.getElementById('chat-messages');
        const messageDiv = document.createElement('div');
        const uniqueId = 'msg-' + Date.now();
        
        messageDiv.id = uniqueId;
        messageDiv.className = `message ${className}`;
        
        // تحويل النص البسيط إلى HTML (الأسطر الجديدة)
        messageDiv.innerHTML = text.replace(/\n/g, '<br>');
        
        messagesContainer.appendChild(messageDiv);
        
        // التمرير للأسفل تلقائياً
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        
        return uniqueId;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
