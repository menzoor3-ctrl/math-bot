<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع الدردشة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.6;
        }

        .message.user {
            background-color: #f0f4f9;
            color: #1f1f1f;
            align-self: flex-start;
            border-top-right-radius: 4px;
        }

        .message.bot {
            background-color: #ffffff;
            color: #1f1f1f;
            align-self: flex-end;
            border: 1px solid #e0e0e0;
            border-top-left-radius: 4px;
        }

        .chat-input-area {
            padding: 20px 30px;
            background-color: #ffffff;
            display: flex;
            gap: 15px;
            align-items: center;
            border-top: 1px solid #f0f0f0;
        }

        .chat-input {
            flex: 1;
            padding: 16px 24px;
            border: 1px solid #e0e0e0;
            border-radius: 30px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            background-color: #ffffff;
        }
        
        .chat-input:focus { 
            border-color: #b3d4ff;
            box-shadow: 0 0 0 2px rgba(179, 212, 255, 0.3);
        }

        .send-btn {
            background-color: transparent;
            color: #1a73e8;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .send-btn:hover { background-color: #f0f4f9; }
        .send-btn svg { width: 24px; height: 24px; fill: currentColor; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-messages" id="chat-messages">
            <div class="message bot">جاري تحميل الرسائل...</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="chat-input" class="chat-input" placeholder="أدخل رسالتك هنا..." autocomplete="off">
            <button class="send-btn" id="send-btn" aria-label="إرسال">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzhyn-8IlCiUhGFzcZXgi43lUEo9g5qlu63yYopbW1UIfhnRZ6IIzRlyo0N7mkVrON67w/exec';
        const CURRENT_USER = 'زائر'; 

        function addMessageToUI(text, senderType) {
            const messageDiv = document.createElement('div');
            messageDiv.className = senderType === 'user' ? 'message user' : 'message bot';
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function fetchInitialMessages() {
            try {
                const response = await fetch(WEB_APP_URL);
                const messages = await response.json();
                
                chatMessages.innerHTML = ''; 
                if (messages.length === 0) {
                    chatMessages.innerHTML = '<div class="message bot">لا توجد رسائل سابقة. ابدأ المحادثة الآن!</div>';
                    return;
                }

                messages.forEach(msg => {
                    const type = (msg.sender === CURRENT_USER) ? 'user' : 'bot';
                    addMessageToUI(msg.message, type);
                });
            } catch (error) {
                console.error('حدث خطأ أثناء جلب الرسائل:', error);
                chatMessages.innerHTML = '<div class="message bot">عذراً، تعذر الاتصال بقاعدة البيانات.</div>';
            }
        }

        async function sendMessage(text) {
            if (text === '') return;

            addMessageToUI(text, 'user');

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors', // لتجاوز قيود المتصفح تماماً عند الرفع على GitHub
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        sender: CURRENT_USER,
                        message: text
                    })
                });
            } catch (error) {
                console.error('حدث خطأ أثناء الإرسال:', error);
            }
        }

        sendBtn.addEventListener('click', () => {
            const text = chatInput.value.trim();
            sendMessage(text);
            chatInput.value = '';
        });

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const text = chatInput.value.trim();
                sendMessage(text);
                chatInput.value = '';
            }
        });

        fetchInitialMessages();
    </script>
</body>
</html>
