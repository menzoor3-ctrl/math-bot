<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الرياضيات الذكية - متصلة بقاعدة البيانات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .gradient-text { background: linear-gradient(to left, #ff8a00, #e52e71); -webkit-background-clip: text; color: transparent; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center min-h-screen font-sans p-4">
    
    <div class="glass w-full max-w-sm h-[750px] rounded-[3rem] shadow-[0_20px_50px_rgba(0,0,0,0.3)] flex flex-col overflow-hidden relative border-[8px] border-white/40">
        
        <!-- الشريط العلوي الحيوي -->
        <div class="bg-gradient-to-r from-amber-400 to-orange-500 p-5 flex justify-between items-center shadow-lg rounded-b-3xl z-10">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-orange-500 text-xl font-bold shadow-inner">👦🏽</div>
                <!-- هنا سيظهر اسم التلميذ من قاعدة بياناتك -->
                <span id="student-name" class="font-bold text-white text-lg drop-shadow-md">جاري التحميل...</span>
            </div>
            <div class="flex items-center gap-2">
                <!-- هنا ستظهر النقاط والجواهر -->
                <span class="bg-white/30 text-white px-2 py-1.5 rounded-full font-bold text-xs shadow-sm flex items-center gap-1 border border-white/50">
                    <i class="fas fa-star text-yellow-200"></i> <span id="student-points">0</span>
                </span>
                <span class="bg-white/30 text-white px-2 py-1.5 rounded-full font-bold text-xs shadow-sm flex items-center gap-1 border border-white/50">
                    <i class="fas fa-gem text-blue-200"></i> <span id="student-gems">0</span>
                </span>
            </div>
        </div>

        <!-- محتوى التطبيق (نفس التصميم السابق) -->
        <div class="text-center mt-4 mb-2 px-4">
            <h2 class="text-lg font-extrabold gradient-text bg-white inline-block px-6 py-2 rounded-full shadow-sm border border-gray-100">
                🚀 الدرس: الدوال التآلفية
            </h2>
        </div>
        <div class="flex-1 p-5 overflow-y-auto flex flex-col gap-5">
            <div class="self-start max-w-[90%]">
                <div class="flex items-end gap-2">
                    <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-500 text-lg mb-2 shadow-sm">🤖</div>
                    <div class="bg-gradient-to-br from-blue-500 to-indigo-600 text-white p-4 rounded-3xl rounded-br-sm shadow-lg border border-blue-400/50">
                        <p class="text-sm font-medium">مرحباً يا بطل! 🌟 تم ربط المنصة بقاعدة بيانات الأستاذ بنجاح.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- السكربت السحري للاتصال بملف Google Sheets الخاص بك -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzVNtsbk_uJcmAcVBtH_iTKPMjSUswAqymXWD4p3YxFuS7ch_ToBqkPF9nWstVX-MRL/exec";

        async function fetchData() {
            try {
                let response = await fetch(API_URL);
                let result = await response.json();
                
                // التأكد من وجود بيانات (أكثر من صف العناوين)
                if (result.data && result.data.length > 1) {
                    let studentName = result.data[1][1]; // العمود الثاني: Nom_Complet
                    let studentPoints = result.data[1][3]; // العمود الرابع: Points
                    let studentGems = result.data[1][4]; // العمود الخامس: Gemmes

                    // تحديث الواجهة بالبيانات الحقيقية
                    document.getElementById('student-name').innerText = studentName;
                    document.getElementById('student-points').innerText = studentPoints;
                    document.getElementById('student-gems').innerText = studentGems;
                    
                    alert(result.message + "\nتم جلب بيانات التلميذ: " + studentName);
                } else {
                    document.getElementById('student-name').innerText = "طالب جديد";
                    alert(result.message + "\nلكن ورقة التلاميذ فارغة، أضف تلميذاً في الصف الثاني!");
                }
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('student-name').innerText = "خطأ في الاتصال";
            }
        }

        // تشغيل دالة الجلب فور تحميل الصفحة
        window.onload = fetchData;
    </script>
</body>
</html>
